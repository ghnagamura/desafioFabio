<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <h1>Register</h1>
            <form action="front.html" method="get" class="login-form" id="login-form">
                <div class="form-row">
                    <label for="firstname" class="label-form" >
                    First Name</label>
                    <input placeholder="First Name" type="text" name="firstname" id="firstname">   
                    <label for="lastname" class="label-form">
                    Last Name:
                    </label>
                    <input type="text" name="lastname" id="lastname" placeholder="Last Name">   
                
                </div>
                <div class="form-row">
                    <label for="Email">Email</label>
                    <input class="email" type="email" placeholder="Email" name="Email">
                </div>
                <div class="form-row">
                    <label for="Password">
                        Password
                    </label>
                    <input class="password" type="password" name="Password" id="Password" placeholder="Password">
                </div>
                <div class="form-row">
                    <label for="confirm">Confirm Password</label>
                    <input class="password" type="password" name="confirm" id="confirm" placeholder="Password">
                </div>

                <div class="agree-row">
                    <input type="checkbox" name="agree" id="agree"><label for="agree"> I accept <a href="">Terms of Use</a> </label>
                </div>

                <div class="submit-row">
                    <button type="submit"><span>Register Now</span></button>
                </div>
            </form>
        
        </div>
        <div class="ball ball1"></div>
        <div class="ball ball2"></div>
        <div class="ball ball3"></div>
        <div class="ball ball4"></div>
        <div class="ball ball5"></div>
        <div class="ball ball6"></div>
        <div class="ball ball7"></div>
        <div class="bar"></div>
        <div class="bar bar2"></div>
        <div class="bar bar3"></div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
